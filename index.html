huge cinematic percussion, gospel choir, muddy piano, hyper-compressed master\n","lyrics":"[Intro - immediate bright staccato piano, filtered pulse]\n\n[Verse 1 - fast, close and precise]\n午前零時　画面の隅で\n未読の数字がまた増えてく\n正解ばかり並べる街に\n僕らの呼吸は載っていない\n\n改札前の白い灯り\n俯く君を薄く照らした\n「急がなくても遅くはない」と\n震える声が先に笑った\n\n[Pre-Chorus - harmony rising, drums briefly thinning]\n予定表を裏返して\n名前のない道を指でなぞる\n誰かの明日を演じるより\n一秒だけ　僕らでいたい\n\n[Chorus - full drums, wide piano and strings]\n通知を消して　風を選んだ\nまだ白くない街を抜けて\n答えがなくて　かまわないから\n君の速度を聞かせてよ\n逆光の中　滲むシグナル\n見えない先を照らしている\n立ち止まることも　進むことだと\n朝の手前で知ったんだ\n\n[Post-Chorus - short original piano and synth answer]\nOh-oh　ほどけた秒針\nOh-oh　僕らの方へ\n\n[Verse 2 - add muted guitar, retain momentum]\nコンビニの窓　流れるニュース\n知らない誰かの完璧な日々\n比べるたびに小さくなった\n願いをポケットから取り出す\n\n「平気」の文字を打っては消して\n君は初めて黙ったままで\n無理に笑わない横顔だけが\n今夜いちばん確かに見えた\n\n[Pre-Chorus - denser phrasing, urgent]\n遠回りの線を選んで\n始発のベルから離れてゆく\n遅れた分だけ拾えるものを\nひとつずつ　声に変えよう\n\n[Chorus - energetic, controlled high register]\n通知を消して　風を選んだ\nまだ眠ってる橋を渡る\n上手く言えない夢の輪郭\n君の歩幅で描いてよ\n逆光の中　揺れるシグナル\n迷った跡も光っている\n昨日の僕らを責めないままで\n朝の向こうへ行けるから\n\n[Instrumental Break - piano run, synth arpeggio, compact strings]\n\n[Bridge - half-time, exposed voice and piano]\n走れない日は　座っていよう\n言葉がないなら　空を見よう\n置いてかれたと感じる夜も\n時計だけが世界じゃない\n\n[Build - rising strings, snare lift, quickening vocal]\n東のビルが青くほどける\n冷えた指先　光を映す\n戻るためじゃない\n逃げるためじゃない\n選び直すために　ここにいる\n\n[Final Chorus - widest arrangement, hopeful release]\n通知を消して　風を選んだ\nいま色づいた街を抜けて\n答えはきっと　ひとつじゃないと\n君の笑い声が告げる\n逆光の中　滲むシグナル\n見えない先を照らしている\n立ち止まることも　進むことだと\n朝の光に書き足そう\n\n[Break - all instruments stop except one piano note]\n僕らの速度で\n\n[Outro - piano cell, drums gone, gentle city air]\n新しい時刻が始まる\n誰のものでもない今日が\n","tracks":[{"label":"逆光のシグナル_V2","notes":"逆光のシグナル_V2.mp3","audio":"songs/gyakkou-signal/audio/%E9%80%86%E5%85%89%E3%81%AE%E3%82%B7%E3%82%B0%E3%83%8A%E3%83%AB_V2.mp3","createdAt":"2026-07-15T14:02:27.458Z"},{"label":"逆光のシグナル_V1","notes":"逆光のシグナル_V1.mp3","audio":"songs/gyakkou-signal/audio/%E9%80%86%E5%85%89%E3%81%AE%E3%82%B7%E3%82%B0%E3 e response]\n夕暮れ　海を染めて\n過ぎた季節を　そっと呼び戻す\n\n[Verse 2 - soft live drums enter, warm and reflective]\n秋の光に　実りが揺れて\nあなたの願いが　明日へ続いてゆく\n離れていても　忘れはしない\n胸に残った　あの日のぬくもりを\n\n[Pre-Chorus - controlled upward ornaments, increasing warmth]\nそれぞれの夢を\nそれぞれの場所で\n信じながら　歩いてゆく\n\n[Chorus - fuller strings and subtle harmony support]\nいつの日か　同じ空の下\n笑って会える\nその日まで\n\n[Bridge - vulnerable vocal, harmonic suspension, strings gradually rising]\nあの日ふたりで\n見上げた空は\n今も変わらず　青いのでしょうか\n\n約束の言葉は\n潮風に揺れて\n遠い未来へ　流れてゆく\n\n[Final Chorus - widest organic arrangement, resonant high register, emotional but restrained]\nそれぞれの空へ\nそれぞれの道を\n涙を越えて　歩いてゆく\n\nいつの日か　同じ風の中\n笑って会える\nその日まで\n\n[Outro - piano and strings decrescendo, gentle ritardando]\nこの道の果てで\nまた会える日まで\nあなたの夢が\n光るように\n\nいつの日か　微笑んで\nまた会える\nその日まで\n","tracks":[{"label":"その日まで_V1","notes":"その日まで_V1.mp3","audio":"songs/sono-hi-made/audio/%E3%81%9D%E3%81%AE%E6%97%A5%E3%81%BE%E3%81%A7_V1.mp3","createdAt":"2026-07-15T08:55:59.258Z"},{"label":"その日まで_V2","notes":"その日まで_V2.mp3","audio":"songs/sono-hi-made/audio/%E3%81%9D%E3%81%AE%E6%97%A5%E3%81%BE%E3%81%A7_V2.mp3","createdAt":"2026-07-15T08:55:58.728Z"}]},{"title":"First Love","slug":"first-love","homageIntent":"致敬初戀結束多年後仍留在心中的溫度；改寫成成熟後回望、感謝而不挽留的故事。","style":"late-1990s inspired R&B ballad, piano-led pop soul. warm analog nostalgia, restrained cinematic atmosphere. 82 BPM. 4/4 time. minor-leaning verses opening into a bittersweet major-colored chorus. Mandarin Chinese with a short English hook lyrics. Instrumentation: acoustic piano (intimate broken chords and the harmonic anchor); warm electric piano (soft R&B color beneath the verses); fingered electric bass (sparse, rounded movement that grows in the chorus); restrained live drums (brush-like verses, fuller snare and cymbals near the climax); string ensemble (long lines entering gradually after the first chorus); clean electric guitar (occasional answering phrases, never dominant). Vocal: intimate lower-register lead vocal, breathy but natural phrasing, controlled verses growing into an open emotional final chorus, subtle harmony stacks only in later choruses.\n","exclude":"artist voice imitation, existing melody quotation, trap hi-hats, EDM drop, aggressive rock guitars, oversized gospel choir, vocal chopping, excessive melisma, hyper-compressed master, cheerful bubblegum pop\n","lyrics":"[Intro - sparse warm piano, distant strings]\nUh... Yeah...\nOh...\n\n[Verse 1 - low intimate register, breathy and conversational]\n窓を叩く雨の音\n冷めたコーヒーの苦味\nソファーに残されたセーター\nまだあなたの匂いがする\n\n[Pre-Chorus - gradually rising melody, increasing tension]\n時間は止まらないのに\n私だけあの日のまま\nどうしてこんなに\n胸が痛いの\n\n[Chorus - emotional but restrained, sustained high notes, soft falsetto]\nYou are always gonna be my light\nいつか誰かと恋に落ちても\nI'll remember the way you held me tight\nあのぬくもりは忘れない\nNow and forever, you're still a part of me\n\n[Verse 2 - slightly fuller bass and drums]\n新しい香水つけて\n知らない街を歩く\nすれ違う人の中に\nあなたの影を探してる\n\n[Pre-Chorus - gradually rising melody, increasing tension]\nどんなに強がってみても\n心は嘘をつけない\nもう一度だけ\n声が聞きたい\n\n[Chorus - wider strings and backing harmonies]\nYou are always gonna be my light\nいつか誰かと恋に落ちても\nI'll remember the way you held me tight\nあのぬくもりは忘れない\nNow and forever, you're still a part of me\n\n[Bridge - piano and strings, vulnerable vocal pause]\nもしも偶然出会えたら\n涙を隠して笑うわ\nI'm doing fine without you...\n少しだけ嘘をついて\n\n[Final Chorus - key change up one semitone, widest arrangement, emotional vocal ad-libs]\nYou are always gonna be my light\nもう二度と戻れなくても\nI'll remember the way you said goodbye\n一番綺麗で悲しい記憶\nNow and forever, I'll keep you safe in my heart\n\n[Outro - piano and strings, decrescendo, gentle ritardando]\nSafe in my heart...\nUh...\nYou will always be my first true love...\n","tracks":[{"label":"Safe in My Heart_V1","notes":"Safe in My Heart_V1.mp3","audio":"songs/first-love/audio/Safe%20in%20My%20Heart_V1.mp3","createdAt":"2026-07-15T08:07:54.223Z"},{"label":"Safe in My Heart_V2","notes":"Safe in My Heart_V2.mp3","audio":"songs/first-love/audio/Safe%
