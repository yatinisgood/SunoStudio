  <script id="library-data" type="application/json">[{"title":"その日まで","slug":"sono-hi-made","homageIntent":"致敬離開故鄉、各自走向不同道路時的離愁與祝福。重新詮釋為隔著海與季節仍替對方守望，約定在各自成長後微笑重逢的故事。","style":"Japanese acoustic folk-pop ballad, Amami shima-uta-influenced contemporary pop, cinematic farewell song. mid-2000s organic Japanese pop, warm coastal atmosphere with generous space, nostalgic but quietly hopeful, traditional island-song emotion expressed through modern acoustic production. 74 BPM. 4/4 time. warm major-key folk-pop harmony with bittersweet suspended tones, open fifths and gentle pentatonic color. Japanese lyrics. Instrumentation: warm acoustic piano (slow open arpeggios and the main harmonic anchor); acoustic guitar (gentle fingerpicking and light strums that suggest forward motion); round electric bass (simple sustained notes, entering gradually after the first verse); restrained live drums (soft kick, brushed snare and sparse cymbal swells); legato string ensemble (long supportive lines that widen the chorus without becoming grandiose); subtle bamboo flute (brief answering phrases in the intro and interlude, airy rather than ornamental); ambient coastal texture.\n","exclude":"artist voice imitation, female lead vocal, bright anime-pop vocal tone, exaggerated enka vibrato, excessive melisma on every line, festival-style folk arrangement, EDM drop, trap hi-hats, aggressive rock guitars, huge cinematic percussion, gospel choir, heavy autotune, hyper-compressed master\n","lyrics":"[Intro - sparse warm piano, distant airy flute, free and spacious]\n風よ　海を越えて\n遠いあなたへ　この想いを運んで\n\n[Verse 1 - intimate high male register, restrained island-folk ornaments]\n春の光に　花がほどけて\n懐かしい声が　胸に咲いてゆく\n歩き出した　あの日の背中を\n今も静かに　空が見守っている\n\n[Pre-Chorus - acoustic guitar and bass enter, melody gradually rising]\nそれぞれの空へ\nそれぞれの道を\n迷いながら　歩いてゆく\n\n[Chorus - wider strings, sustained vowels, gentle falsetto release]\nいつの日か　同じ風の中\n笑って会える\nその日まで\n\n[Interlude - piano, acoustic guitar and a short airy flute response]\n horuses.\n","exclude":"artist voice imitation, existing melody quotation, trap hi-hats, EDM drop, aggressive rock guitars, oversized gospel choir, vocal chopping, excessive melisma, hyper-compressed master, cheerful bubblegum pop\n","lyrics":"[Intro - sparse warm piano, distant strings]\nUh... Yeah...\nOh...\n\n[Verse 1 - low intimate register, breathy and conversational]\n窓を叩く雨の音\n冷めたコーヒーの苦味\nソファーに残されたセーター\nまだあなたの匂いがする\n\n[Pre-Chorus - gradually rising melody, increasing tension]\n時間は止まらないのに\n私だけあの日のまま\nどうしてこんなに\n胸が痛いの\n\n[Chorus - emotional but restrained, sustained high notes, soft falsetto]\nYou are always gonna be my light\nいつか誰かと恋に落ちても\nI'll remember the way you held me tight\nあのぬくもりは忘れない\nNow and forever, you're still a part of me\n\n[Verse 2 - slightly fuller bass and drums]\n新しい香水つけて\n知らない街を歩く\nすれ違う人の中に\nあなたの影を探してる\n\n[Pre-Chorus - gradually rising melody, increasing tension]\nどんなに強がってみても\n心は嘘をつけない\nもう一度だけ\n声が聞きたい\n\n[Chorus - wider strings and backing harmonies]\nYou are always gonna be my light\nいつか誰かと恋に落ちても\nI'll remember the way you held me tight\nあのぬくもりは忘れない\nNow and forever, you're still a part of me\n\n[Bridge - piano and strings, vulnerable vocal pause]\nもしも偶然出会えたら\n涙を隠して笑うわ\nI'm doing fine without you...\n少しだけ嘘をついて\n\n[Final Chorus - key change up one semitone, widest arrangement, emotional vocal ad-libs]\nYou are always gonna be my light\nもう二度と戻れなくても\nI'll remember the way you said goodbye\n一番綺麗で悲しい記憶\nNow and forever, I'll keep you safe in my heart\n\n[Outro - piano and strings, decrescendo, gentle ritardando]\nSafe in my heart...\nUh...\nYou will always be my first true love...\n","tracks":[{"label":"Safe in My Heart_V1","notes":"Safe in My Heart_V1.mp3","audio":"songs/first-love/audio/Safe%20in%20My%20Heart_V1.mp3"},{"label":"Safe in My Heart_V2","notes":"Safe in My Heart_V2.mp3","audio":"songs/first-love/audio/Safe%20in%20My%20Heart_V2.mp3"}]},{"title":"逆光シグナル","slug":"gyakkou-signal","homageIntent":"研究高速鋼琴驅動的現代日系敘事流行、密集歌詞與明暗急轉的情緒推進，重新詮釋為兩個被城市通知與期待壓得喘不過氣的人，在第一班電車到來前關掉手機，選擇照自己的節奏前進。","style":"fast piano-driven Japanese narrative pop, electronic pop rock with orchestral accents, high-energy nocturnal city pop. polished contemporary Japanese pop, urgent, luminous and bittersweet, dense forward motion with sharp light-and-shadow contrast, cinematic city-at-midnight atmosphere without retro city-pop styling. 132 BPM. 4/4 time. minor-key verses with rapid diatonic motion, suspended tension and a bright relative-major lift in the chorus; fully original chord progression and melody. Japanese lyrics. Instrumentation: bright acoustic piano (rapid staccato arpeggios, syncopated chord jabs and short ascending fills; original motifs only); tight electronic-acoustic drum kit (punchy kick, crisp snare, fast closed hi-hats and brief tom lifts into choruses); picked electric bass (nimble melodic movement that locks tightly with the kick without copying any existing bass line); layered analog synth arpeggio (subtle sixteenth-note propulsion beneath the piano); muted clean electric guitar.\n","exclude":"artist voice imitation, existing melody or lyric quotation, recognizable intro or bass-line recreation, direct reference to any artist or song title in the generated lyrics, suicidal or self-destructive ending, EDM festival drop, trap hi-hat rolls, retro funk city pop, heavy metal guitars, acoustic ballad pacing, vocal chops, excessive melisma, huge cinematic percussion, gospel choir, muddy piano, hyper-compressed master\n","lyrics":"[Intro - immediate bright staccato piano, filtered pulse]\n\n[Verse 1 - fast, close and precise]\n午前零時　画面の隅で\n未読の数字がまた増えてく\n正解ばかり並べる街に\n僕らの呼吸は載っていない\n\n改札前の白い灯り\n俯く君を薄く照らした\n「急がなくても遅くはない」と\n震える声が先に笑った\n\n[Pre-Chorus - harmony rising, drums briefly thinning]\n予定表を裏返して\n名前のない道を指でなぞる\n誰かの明日を演じるより\n一秒だけ　僕らでいたい\n\n[Chorus - full drums, wide piano and strings]\n通知を消して　風を選んだ\nまだ白くない街を抜けて\n答えがなくて　かまわないから\n君の速度を聞かせてよ\n逆光の中　滲むシグナル\n見えない先を照らしている\n立ち止まることも　進むことだと\n朝の手前で知ったんだ\n\n[Post-Chorus - short original piano and synth answer]\nOh-oh　ほどけた秒針\nOh-oh　僕らの方へ\n\n[Verse 2 - add muted guitar, retain momentum]\nコンビニの窓　流れるニュース\n知らない誰かの完璧な日々\n比べるたびに小さくなった\n願いをポケットから取り出す\n\n「平気」の文字を打っては消して\n君は初めて黙ったままで\n無理に笑わない横顔だけが\n今夜いちばん確かに見えた\n\n[Pre-Chorus - denser phrasing, urgent]\n遠回りの線を選んで\n始発のベルから離れてゆく\n遅れた分だけ拾えるものを\nひとつずつ　声に変えよう\n\n[Chorus - energetic, controlled high register]\n通知を消して　風を選んだ\nまだ眠ってる橋を渡る\n上手く言えない夢の輪郭\n君の歩幅で描いてよ\n逆光の中　揺れるシグナル\n迷った跡も光っている\n昨日の僕らを責めないままで\n朝の向こうへ行けるから\n\n[Instrumental Break - piano run, synth arpeggio, compact strings]\n\n[Bridge - half-time, exposed voice and piano]\n走れない日は　座っていよう\n言葉がないなら　空を見よう\n置いてかれたと感じる夜も\n時計だけが世界じゃない\n\n[Build - rising strings, snare lift, quickening vocal]\n東のビルが青くほどける\n冷えた指先　光を映す\n戻るためじゃない\n逃げるためじゃない\n選び直すために　ここにいる\n\n[Final Chorus - widest arrangement, hopeful release]\n通知を消して　風を選んだ\nいま色づいた街を抜けて\n答えはきっと　ひとつじゃないと\n君の笑い声が告げる\n逆光の中　滲むシグナル\n見えない先を照らしている\n立ち止まることも　進むことだと\n朝の光に書き足そう\n\n[Break - all instruments stop except one piano note]\n僕らの速度で\n\n[Outro - piano cell, drums gone, gentle city air]\n新しい時刻が始まる\n誰のものでもない今日が\n","tracks":[{"label":"逆光のシグナル_V1","notes":"逆光のシグナル_V1.mp3","audio":"songs/gyakkou-signal/audio/%E9%80%86%E5%85%89%E3%81%AE%E3%82%B7%E3%82%B0%E3%83%8A%E3%83%AB_V1.mp3"},{"label":"逆光のシグナル_V2","notes":"逆光のシグナル_V2.mp3","audio":"songs/gyakkou-signal/audio/%E9%80%86%E5%85%89%E3%81%AE%E3%82%B7%E3%82%B0%E3%83%8A%E3%83%AB_V2.mp3"}]},{"title":"ノイズの花","slug":"noise-no-hana","homageIntent":"研究帶有危險感的高速日系電子流行、切分低音、銳利鼓組、戲劇化段落切換，以及年輕女聲在低語與爆發之間的張力。重新詮釋為一座以分數決定價值的城市中，敘事者撕掉「合格」標籤，替被系統消音的朋友奪回名字與聲音。","style":"dark kinetic Japanese electro-pop, syncopated electronic pop rock. sleek contemporary J-pop, dystopian neon tension, restless, gritty and theatrical with sudden negative space. 128 BPM. 4/4 time. dark minor, chromatic bass tension, brighter defiant chorus; original progression. Japanese lyrics. Instrumentation: distorted synth bass (syncopated chromatic groove); hybrid electronic drums (dry kick, metallic snare, shuffled hats); percussive piano (low stabs and tense clusters); glitch synth plucks (offbeat answers); low synth brass (dissonant accents); muted electric guitar (scraped chorus pulses). Vocal: youthful Japanese female lead, clear, agile, naturally edgy, precise rapid verses, open controlled high chorus; no singer imitation. Production: dry close verse vocal, wider dark chorus, tight kick and bass, brief dropouts, gritty stereo glitches, clear diction and dynamic master.\n","exclude":"artist voice imitation, existing melody, lyric, bass-line or brass-motif quotation, direct reference to any artist or song title in generated lyrics, beast, monster, predator or devouring imagery, violent revenge narrative, anime character voice, male lead vocal, trap hi-hat rolls, dubstep wobble bass, EDM festival drop, retro funk city pop, metal screaming, orchestral trailer percussion, gospel choir, vocal chops as the main hook, excessive melisma, muddy low end, hyper-compressed master\n","lyrics":"[Intro - distorted syncopated bass, metallic clicks, one piano stab]\nNine, eight, seven...\n更新完了\n\n[Verse 1 - dry, fast and rhythmically precise]\n午前八時のスクリーンには\n昨日と同じ笑顔の列\n胸元に灯る緑の印\nそれだけあれば通れる街\n\n教室の隅　空いた机\n名前の欄だけ白くなった\n誰も気づかずページをめくる\n僕も静かに真似をしていた\n\n[Pre-Chorus - rising mono synth, unstable drum accents]\nイヤホンの奥　途切れた声が\n「ここにいたよ」と歪んで響く\n正しさだけで塞いだ耳を\n今夜　この手でほどいてゆく\n\n[Chorus - wide, explosive, controlled high notes]\nノイズの花よ　コンクリートを裂け\n消された音を空へ返せ\n綺麗なコードに揃わなくても\n震える波形は生きている\n赤い警告　降り注ぐほど\n僕らの声は色を増してく\n合格なんてもう要らない\n君の名前を街に放つ\n\n[Post-Chorus - bass and metallic clap]\nZeroじゃない\nZeroじゃない\n\n[Verse 2 - denser hats and percussive piano]\n便利なドアを開けるたびに\n見えない誰かが外へ押された\n知らずにいたと口にするほど\n昨日の沈黙が重くなる\n\n借りものみたいな優等生を\n脱ぎ捨てた跡　傷が光る\n震える指で回線を繋ぎ\n君の録音を再生した\n\n[Pre-Chorus - vocal quickens, drums fragment]\n広告塔が一斉に消え\n黒い画面へ波が広がる\nひとつの声をエラーと呼んだ\nその辞書ごと書き換えよう\n\n[Chorus - stronger bass, wider guitar]\nノイズの花よ　コンクリートを裂け\n閉ざした窓を揺らしながら\n上手な言葉に直さなくても\n途切れた息まで届いてる\n赤い警告　降り注ぐほど\n知らない声が色を重ねる\n採点なんて追いつけない\n君の名前が街を満たす\n\n[Breakdown - near-spoken, filtered room tone]\n僕は選ばれたんじゃない\n見えない線の内側で\n黙っていただけ\n\nごめんを鍵にはしない\n今日の扉を開けるため\n息を吸う\n\n[Bridge - half-time, rising string tremolo]\n違う高さで　違う速さで\n重ならなくても　響き合える\n誰かの基準で薄めた声を\nそのままここへ連れてきて\n\n[Build - rapid phrasing, chromatic bass ascent]\n北の窓から　南の路地から\n地下のホームから　屋上から\n途切れて　遅れて　掠れて　歪んで\n数えきれない波が立ち上がる\n\n[Half-Beat Stop]\n\n[Final Chorus - fullest width, octave doubles and counterlines]\nノイズの花よ　コンクリートを裂け\n消された音を空へ返せ\n綺麗なコードに揃わないから\n新しい景色が生まれてく\n赤い警告　朝焼けに変わり\n僕らの声は色を増してく\n合格なんてもう要らない\nそれぞれの名前　街に放て\n\n[Post-Chorus - layered individual voices, not a choir]\nZeroじゃない\n誰も　Zeroじゃない\n\n[Outro - groove fragments into clicks, final clean voice]\n聞こえるよ\nここにいる\n","tracks":[{"label":"ノイズの花_V1","notes":"ノイズの花_V1.mp3","audio":"songs/noise-no-hana/audio/%E3%83%8E%E3%82%A4%E3%82%BA%E3%81%AE%E8%8A%B1_V1.mp3"},{"label":"ノイズの花_V2","notes":"ノイズの花_V2.mp3","audio":"songs/noise-no-hana/audio/%E3%83%8E%E3%82%A4%E3%82%BA%E3%81%AE%E8%8A%B1_V2.mp3"}]}]</script>
